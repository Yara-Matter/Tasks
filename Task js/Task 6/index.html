<!DOCTYPE html>
<html>
<head>
    <title>Task 6</title>
</head>
<body>

    <h2>Simple Calculator</h2>

    <input type="text" id="num1" placeholder="Number 1">

    <input type="text" id="num2" placeholder="Number 2">

    <select id="operation">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
        <option value="%">%</option>
    </select>

    <button id="calculate">Calculate</button>

    <p id="result"></p>

    <script src="plugin.js"></script>
</body>
</html>
